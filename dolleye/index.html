<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doll·Eye Pinball · 모호성 게임 기획 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEDF6; --card:#FFFFFF; --ink:#1B1A33; --muted:#5B5A77; --line:#D6D6E6;
  --accent:#4A4FC4; --spot:#E8932A; --spot-soft:#F7E2C4; --deep:#1B1A33; --on-deep:#ECECF7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13122A; --card:#1D1C38; --ink:#ECECF7; --muted:#A4A3C2; --line:#302F52;
    --accent:#A3A6FF; --spot:#F2AE52; --spot-soft:#3A2C1C; --deep:#0C0B1E; --on-deep:#ECECF7;
  }
}
:root[data-theme="dark"]{
  --bg:#13122A; --card:#1D1C38; --ink:#ECECF7; --muted:#A4A3C2; --line:#302F52;
  --accent:#A3A6FF; --spot:#F2AE52; --spot-soft:#3A2C1C; --deep:#0C0B1E; --on-deep:#ECECF7;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.75 "Noto Sans KR",system-ui,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--spot);outline-offset:3px}
.serif{font-family:"Hahmlet",serif}
.w{max-width:1120px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.w{padding:0 16px}}
.nar{max-width:720px}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:18px;padding:14px 24px;color:#fff;transition:background .25s,color .25s}
.nav.solid{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);color:var(--ink);border-bottom:1px solid var(--line)}
.nav b{font-weight:700}
.nav a{text-decoration:none;font-size:14px;opacity:.85}
.nav .sp{margin-left:auto;display:flex;gap:16px;align-items:center}
.nav button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 12px;font:500 13px "Noto Sans KR";cursor:pointer}
#theme{display:inline-flex;align-items:center;gap:6px}
#theme svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#theme svg path:only-child{fill:currentColor;stroke:none}
@media (max-width:640px){.nav{padding:12px 16px}.nav .hide{display:none}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;background:#000;overflow:hidden}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,11,30,.35) 0%,rgba(12,11,30,0) 30%,rgba(12,11,30,.85) 100%)}
.hero .w{position:relative;z-index:1;padding-bottom:9vh;width:100%}
.hero h1{font-family:"Hahmlet",serif;font-weight:800;font-size:clamp(34px,10.4vw,124px);line-height:.98;margin:0;letter-spacing:-.03em}
.hero p.t{font-family:"Hahmlet",serif;font-weight:300;font-size:clamp(20px,3vw,34px);line-height:1.4;margin:16px 0 22px;text-wrap:balance}
.hero dl{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0;font-size:14px}
.hero dt{opacity:.7}.hero dd{margin:0;font-weight:500}
.hero dl div{display:flex;gap:8px}

section{padding:120px 0}
@media (max-width:640px){section{padding:80px 0}}
.kicker{font-size:15px;color:var(--spot);font-weight:700;margin:0 0 14px}
h2{font-family:"Hahmlet",serif;font-weight:700;font-size:clamp(32px,5vw,58px);line-height:1.18;letter-spacing:-.025em;margin:0 0 22px}
h3{font-family:"Hahmlet",serif;font-weight:700;font-size:clamp(22px,2.6vw,28px);line-height:1.35;margin:0 0 10px;letter-spacing:-.015em}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);margin:0 0 40px}
.muted{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}

/* overview */
.loop{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;margin-top:8px;transition:grid-template-columns .45s cubic-bezier(.2,.7,.2,1)}
@media (max-width:860px){.loop{grid-template-columns:1fr}}
.loop figure{margin:0;background:var(--card);border-radius:14px;overflow:hidden}
.loop .lp-m{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000}
.loop .lp-m img,.loop .lp-m video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.loop .lp-m video{opacity:0;transition:opacity .3s}
.loop figure.on video.ready{opacity:1}
.loop figure[tabindex]{cursor:pointer;outline-offset:3px}
.lp-play{position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(12,11,30,.62);transition:opacity .3s}
.lp-play::after{content:"";position:absolute;left:13px;top:10px;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.loop figure.on .lp-play{opacity:0}
@media (prefers-reduced-motion:reduce){.loop{transition:none}.lp-play{display:none}}
.loop figcaption{padding:16px 18px 18px}
.loop b{font-family:"Hahmlet",serif;font-size:22px;display:block}
.loop span{font-size:15px;color:var(--muted)}
.clock{margin-top:8px;display:flex;border-radius:999px;overflow:hidden;font-size:14px;background:var(--card)}
.clock div{flex:2;padding:12px 16px;border-right:1px solid var(--line)}
.clock div:last-child{flex:4;border:0}
.clock .show{background:var(--accent);color:#fff}
.clock small{display:block;font-size:12px;opacity:.75}
@media (max-width:640px){.clock{flex-wrap:wrap;border-radius:14px}.clock div{flex:1 1 50%}}
.scale{font-size:13px;font-weight:700;color:var(--muted);margin:32px 0 0}
.daywrap{margin-top:8px}
.days{display:grid;grid-template-columns:repeat(3,1fr) .8fr;gap:6px}
.days button{all:unset;box-sizing:border-box;position:relative;cursor:pointer;background:var(--card);border-radius:12px;padding:10px 16px 12px;font-size:15px;font-weight:500;color:var(--ink);border:1px solid transparent;transition:background .2s,border-color .2s}
.days button:last-child{background:var(--spot-soft)}
.days button:hover,.days button[aria-expanded="true"]{border-color:var(--accent)}
.days button[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.days button:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.days small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.days .more{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:700;color:var(--accent)}
.days .more::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.days button[aria-expanded="true"] .more::after{transform:translateY(1px) rotate(225deg)}
.daywrap:not(.used) .days button:first-child .more{animation:nudge 1.6s ease-in-out 1s 3}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(3px)}}
.dayx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.7,.2,1)}
.dayx.open{grid-template-rows:1fr}
.dayx>div{overflow:hidden}
.dayx .in{position:relative;margin-top:12px;border:1px solid var(--accent);border-radius:16px;padding:14px;background:var(--card)}
.dayx .in::before{content:"";position:absolute;top:-7px;left:var(--tx,50%);width:12px;height:12px;margin-left:-6px;background:var(--card);border-left:1px solid var(--accent);border-top:1px solid var(--accent);border-top-left-radius:3px;transform:rotate(45deg);transition:left .25s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.dayx .in::before{transition:none}}
.dayx .dxh{margin:0 0 8px;font-size:14px;font-weight:700}
.dayx .dxn{margin:8px 0 0;font-size:13px;color:var(--muted)}
.dayx .clock{margin-top:0;background:var(--bg)}
.hint{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:13px;color:var(--accent);font-weight:500}
.hint::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box;background:radial-gradient(currentColor 0 2px,transparent 3px)}
.daywrap.used .hint{opacity:.6}
@media (max-width:640px){.days{grid-template-columns:1fr 1fr}}
.intent{margin:-8px 0 40px;padding:22px 24px;border-radius:14px;background:var(--card)}
.quote{font-family:"Hahmlet",serif;font-weight:500;font-size:clamp(22px,2.6vw,30px);line-height:1.4;margin:8px 0 18px}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0}
.parts div{border-top:2px solid var(--accent);padding-top:8px}
.parts dt{font-weight:700;font-size:15px}
.parts dd{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.55}
@media (max-width:760px){.parts{grid-template-columns:1fr 1fr}}
.quote cite{display:block;font:500 14px "Noto Sans KR";color:var(--muted);margin-top:10px;font-style:normal}

/* AI scrolly */
.ai{background:var(--deep);color:var(--on-deep)}
.ai .lead,.ai .muted,.ai .small{color:#A9A8C8}
.ai .kicker{color:var(--spot)}
.scrolly{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:48px;margin-top:40px}
.stage{position:sticky;top:12vh;height:76vh;display:flex;align-items:center}
@media (max-width:900px){.scrolly{grid-template-columns:minmax(0,1fr)}.stage{display:none}}
.diagram{width:100%;display:grid;gap:10px}
.layer{border:1px solid #3A3962;border-radius:12px;padding:14px 16px;transition:background .35s,border-color .35s,opacity .35s,transform .35s;opacity:.38}
.layer b{display:block;font-size:15px}
.layer span{font-size:13px;color:#A9A8C8}
.layer.on{opacity:1;background:#26254A;border-color:var(--spot);transform:translateX(6px)}
.layer .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.layer .row i{font-style:normal;font-size:12px;padding:2px 8px;border-radius:999px;background:#33325C}
.steps .st{min-height:72vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0;transition:opacity .3s}
@media (min-width:901px){.steps .st{opacity:.35}.steps .st.on{opacity:1}}
.layer{cursor:pointer}
@media (max-width:900px){.steps .st{min-height:auto;padding:28px 0;border-top:1px solid #33325C}}
.st .n{font-family:"Hahmlet",serif;font-size:15px;color:var(--spot);font-weight:700}
.st h3{color:#fff;margin-top:6px}
.st p{color:#C8C7E0;margin:0 0 12px}
.st ul{margin:0;padding-left:18px;color:#C8C7E0;font-size:15px}
.st blockquote{margin:16px 0 0;padding:0 0 0 16px;border-left:2px solid var(--spot);font-family:"Hahmlet",serif;font-weight:300;font-size:20px;line-height:1.5;color:#fff}
.st blockquote cite{display:block;font:400 13px "Noto Sans KR";color:#A9A8C8;margin-top:6px;font-style:normal}
.comp{display:inline-block;font-size:12px;border:1px solid #4A4978;border-radius:999px;padding:1px 10px;margin-left:8px;color:#C8C7E0;vertical-align:2px}

.figures{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#33325C;border-radius:14px;overflow:hidden;margin:80px 0 0}
@media (max-width:760px){.figures{grid-template-columns:repeat(2,1fr)}}
.figures div{background:var(--deep);padding:22px 20px}
.figures b{font-family:"Hahmlet",serif;font-size:clamp(34px,4vw,48px);font-weight:700;line-height:1;color:#fff}
.figures span{display:block;margin-top:8px;font-size:14px;color:#C8C7E0}
.figures em{font-style:normal;font-size:12px;color:#8F8EB0}

.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.panel{background:#1F1E3D;border-radius:14px;padding:24px}
.panel h4{font-family:"Hahmlet",serif;font-size:20px;margin:0 0 14px;color:#fff;font-weight:700}
.who{display:grid;gap:12px}
.who div{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:14px;padding-top:12px;border-top:1px solid #33325C}
.who div:first-child{border:0;padding:0}
.who b{color:#fff}
.who s{text-decoration:none;color:#8F8EB0;display:block}
.lad{display:flex;flex-direction:column-reverse;gap:4px}
.lad div{display:flex;justify-content:space-between;font-size:14px;padding:8px 12px;border-radius:8px;background:#2A2950}
.lad div.h{background:var(--spot);color:#1B1A33;font-weight:700}
.lad span{opacity:.75;font-size:12px}

/* horizontal timeline */
.tl-wrap{margin-top:20px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:#3A3962 transparent}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:240px;gap:14px;position:relative;padding-top:26px;min-width:max-content}
.tl::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:#3A3962}
.tl div{position:relative;font-size:14px}
.tl div::before{content:"";position:absolute;top:-24px;left:0;width:12px;height:12px;border-radius:50%;background:var(--deep);border:2px solid #8F8EB0}
.tl .loosen::before{border-color:#6FD3A6}.tl .tighten::before{border-color:#FF8A9B}.tl .team::before{background:var(--spot);border-color:var(--spot)}
.tl time{color:var(--spot);font-weight:700;font-size:13px}
.tl b{display:block;color:#fff;font-size:16px;margin:2px 0}
.tl p{margin:0;color:#A9A8C8}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#A9A8C8;margin-top:6px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:2px solid var(--c);background:var(--b,transparent);vertical-align:-1px}
.verdict{display:grid;gap:8px;margin:0}
.verdict div{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:14px}
.verdict dt{font-weight:700}
.verdict dd{margin:0;color:#C8C7E0}
.flow{display:grid;gap:10px;margin-top:6px}
.flow .r{font-size:13px;color:#C8C7E0}
.flow .bar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:#2A2950;margin-top:4px}
.flow .bar span{height:100%}

/* tests */
.cmp{display:grid;gap:28px;margin-top:20px}
.met .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.met b{font-family:"Hahmlet",serif;font-size:22px;font-weight:700}
.met em{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap}
.met .track{position:relative;height:14px;border-radius:999px;background:var(--line);margin-top:10px;overflow:hidden}
.met .track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.met .pre{background:color-mix(in srgb,var(--muted) 55%,transparent)}
.met .post{background:var(--accent);mix-blend-mode:normal}
.met .track i.post{width:0}
.met.in .track i.post{width:var(--w)}
.m1{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:860px){.m1{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:14px;padding:26px}
.card dl{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin:0;font-size:15px}
.card dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.decide{background:var(--spot-soft);border-radius:14px;padding:26px}
.decide p.serif{font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.45;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.chips li{font-size:14px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line)}

/* values */
.vals{display:grid;gap:0;margin-top:20px;border-top:1px solid var(--line)}
.vals article{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:32px 0;border-bottom:1px solid var(--line)}
@media (max-width:860px){.vals article{grid-template-columns:1fr;gap:10px}}
.vals h3{font-weight:500}
.vals p{margin:0 0 6px;color:var(--muted)}

/* systems carousel */
.car-h{display:flex;align-items:end;justify-content:space-between;gap:20px}
.car-btn{display:flex;gap:8px}
.car-btn button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.car{display:grid;grid-auto-flow:column;grid-auto-columns:min(460px,86vw);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 32px 20px;scroll-padding-inline:32px;margin-top:20px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
@media (min-width:1184px){.car{padding-left:calc((100vw - 1120px)/2 + 32px);scroll-padding-left:calc((100vw - 1120px)/2 + 32px)}}
@media (max-width:640px){.car{padding:8px 16px 20px;scroll-padding-inline:16px}}
.sc{scroll-snap-align:start;background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.sc .m{background:#000;aspect-ratio:16/9}
.sc .m img,.sc .m video{width:100%;height:100%;object-fit:cover}
.sc .tx{padding:22px 24px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.sc .tg{font-size:13px;color:var(--accent);font-weight:700}
.sc h3{margin:0}
.sc .in{font-family:"Hahmlet",serif;font-weight:300;font-size:19px;line-height:1.5;margin:0}
.sc details{font-size:15px;margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.sc summary{cursor:pointer;font-weight:500;color:var(--muted)}
.sc details p,.sc details ul{margin:8px 0 0;font-size:15px}
.sc details ul{padding-left:18px}
.sc .res{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}

.scope{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:760px){.scope{grid-template-columns:1fr}}
.scope ul{margin:0;padding-left:18px;font-size:15px}
footer{padding:40px 0 64px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
footer .w{display:flex;gap:18px;flex-wrap:wrap}

.xlink{color:inherit;text-decoration:none;padding:0 .12em;margin:0 -.12em;border-radius:3px;background-image:linear-gradient(var(--xl-fill),var(--xl-fill)),linear-gradient(var(--xl-line),var(--xl-line));background-repeat:no-repeat;background-position:0 100%,0 100%;background-size:100% 0%,100% 1px;transition:background-size .28s cubic-bezier(.2,.7,.2,1)}
.xlink:hover,.xlink:focus-visible{background-size:100% 100%,100% 1px}
@media (prefers-reduced-motion:reduce){.xlink{transition:none}}
.xlink{--xl-line:color-mix(in srgb,currentColor 40%,transparent);--xl-fill:color-mix(in srgb,currentColor 10%,transparent)}
.xlink:hover,.xlink:focus-visible{--xl-line:var(--spot);--xl-fill:color-mix(in srgb,var(--spot) 30%,transparent)}
#aiLead{max-width:none;text-wrap:pretty}
#valBody{max-width:none}
.core-f p,.core-lb{max-width:none!important}
.wb{display:none}
@media (min-width:1000px){.wb{display:inline}}
.ev-l{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.02em}
.ev-stats{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.ev-stats b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.ev-stats span{display:block;font-size:13px;line-height:1.5}
.ev-check{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.ev-check li{display:flex;gap:8px;align-items:flex-start}
.ev-check li::before{content:"";flex:0 0 14px;height:14px;margin-top:4px;border-radius:3px;border:1.5px solid currentColor;background:linear-gradient(currentColor,currentColor) center/6px 6px no-repeat}
.ev-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev-cmp>div{border-radius:8px;padding:10px 12px}
.ev-cmp small{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.ev-cmp p{margin:0 0 4px;font-size:14px;line-height:1.6}
.ev-cmp cite,.ev-q cite{display:block;font-style:normal;font-size:12px;opacity:.7;margin-top:4px}
.ev-q{margin:10px 0 0;padding:0 0 0 12px;border-left:2px solid currentColor;font-size:14px;line-height:1.6}
@media (max-width:640px){.ev-stats,.ev-check,.ev-cmp{grid-template-columns:1fr}}

<script src="content.js"></script>
<script>
(function(){
  const C = window.CC, $ = s => document.getElementById(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const li = a => a.map(x => `<li>${x}</li>`).join("");
  const root = document.documentElement, KEY = "cc-theme";
  const paged = () => root.classList.contains("paged");
  try { const t = localStorage.getItem(KEY); if (t) root.dataset.theme = t; } catch(e){}
  // 테마 버튼은 지금과 반대 모드의 이름과 아이콘을 보여 준다.
  const sysDark = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : sysDark.matches;
  const SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8 8 0 0 1 9.4 4a8 8 0 1 0 10.6 10.6Z"/></svg>';
  const themeBtn = $("theme");
  const paintTheme = () => { const d = isDark(); themeBtn.innerHTML = (d ? SUN : MOON) + "<span>" + (d ? "화이트 모드" : "다크 모드") + "</span>"; themeBtn.setAttribute("aria-label", d ? "화이트 모드로 바꾸기" : "다크 모드로 바꾸기"); };
  themeBtn.onclick = () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem(KEY, root.dataset.theme); } catch(e){}
    paintTheme();
  };
  sysDark.addEventListener("change", paintTheme);
  paintTheme();
  const nav = $("nav");
  const onScroll = () => nav.classList.toggle("solid", scrollY > innerHeight * .8);
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelector(".hero video").removeAttribute("autoplay");

  $("tagline").innerHTML = esc(C.tagline).replace(/,\s*/, ",<br>");
  $("facts").innerHTML = [C.facts[0], C.facts[2], C.facts[3], ["맡은 일", C.roles.map(r => r.name).join(", ")]].map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  $("summary").innerHTML = C.summary;
  // 개요 세 칸: 마우스를 올리거나(모바일은 탭) 포커스하면 그 칸이 커지고 짧은 플레이 영상이 반복 재생된다.
  const loopEl = $("loop");
  loopEl.innerHTML = C.loop.map((l, i) => `<figure data-i="${i}"${l.video ? ' tabindex="0"' : ""}><div class="lp-m"><img src="${l.img}" alt="${l.key} 장면">${l.video ? `<video src="${l.video}" muted loop playsinline preload="none" aria-hidden="true"></video><i class="lp-play" aria-hidden="true"></i>` : ""}</div><figcaption><b>${l.key}</b><span>${l.text}</span></figcaption></figure>`).join("");
  (() => {
    const figs = [...loopEl.children], BASE = [1.4, 1, 1];
    const still = matchMedia("(prefers-reduced-motion: reduce)"), wide = matchMedia("(min-width: 861px)"), hov = matchMedia("(hover: hover)");
    let cur = -1;
    const set = i => {
      if (i === cur) return;
      cur = i;
      figs.forEach((f, k) => {
        const on = k === i, v = f.querySelector("video");
        f.classList.toggle("on", on);
        if (!v) return;
        if (on && !still.matches) { v.currentTime = 0; const p = v.play(); if (p) p.catch(() => {}); }
        else { v.pause(); v.classList.remove("ready"); }
      });
      loopEl.style.gridTemplateColumns = wide.matches && i >= 0 ? BASE.map((b, k) => (k === i ? "1.8fr" : "1fr")).join(" ") : "";
    };
    figs.forEach((f, i) => {
      const v = f.querySelector("video");
      if (!v) return;
      v.addEventListener("playing", () => v.classList.add("ready"));
      f.addEventListener("mouseenter", () => { if (hov.matches) set(i); });
      f.addEventListener("focus", () => set(i));
      f.addEventListener("click", () => { if (!hov.matches) set(cur === i ? -1 : i); });
    });
    loopEl.addEventListener("mouseleave", () => { if (hov.matches) set(-1); });
    loopEl.addEventListener("focusout", e => { if (!loopEl.contains(e.relatedTarget)) set(-1); });
    wide.addEventListener("change", () => { const i = cur; cur = -2; set(i); });
  })();
  // 스테이지 흐름: 웨이브에 마우스를 올리거나 누르면 그 웨이브의 진행과 학습 의도가 펼쳐진다.
  const seg = d => `<div class="${d.kind}"><small>${d.time}</small>${d.name}</div>`;
  const fine = matchMedia("(hover: hover) and (pointer: fine)").matches;
  $("dayHint").textContent = fine ? "웨이브에 마우스를 올리면 그 웨이브의 흐름과 학습 의도가 펼쳐집니다" : "웨이브를 누르면 그 웨이브의 흐름과 학습 의도가 펼쳐집니다";
  $("days").innerHTML = C.days.map((d,i) => `<button type="button" data-i="${i}" aria-expanded="false" aria-controls="dayPanel">${d.name}<small>${d.detail}</small><span class="more">${i === C.days.length - 1 ? "마지막 웨이브" : "웨이브 흐름 보기"}</span></button>`).join("");
  const dbtn = [...$("days").children], wrap = $("daywrap");
  let openI = -1, pinned = false;
  function openDay(i){
    openI = i; wrap.classList.add("used");
    dbtn.forEach((b,j) => b.setAttribute("aria-expanded", j === i));
    const last = i === C.days.length - 1, d = C.days[i];
    $("dxh").textContent = `${d.name} · ${d.learn}`;
    $("clock").innerHTML = (last ? C.bossWave : C.wave).map(seg).join("");
    $("dxn").textContent = d.note;
    aimTail();
    $("dayx").classList.add("open");
  }
  function aimTail(){
    if (openI < 0) return;
    const r = dbtn[openI].getBoundingClientRect(), p = $("dayPanel").getBoundingClientRect();
    $("dayPanel").style.setProperty("--tx", `${r.left + r.width / 2 - p.left}px`);
  }
  addEventListener("resize", aimTail);
  function closeDay(){ openI = -1; pinned = false; dbtn.forEach(b => b.setAttribute("aria-expanded", false)); $("dayx").classList.remove("open"); }
  dbtn.forEach((b,i) => {
    if (fine) b.addEventListener("mouseenter", () => { if (!pinned) openDay(i); });
    b.addEventListener("focus", () => { if (!pinned) openDay(i); });
    b.addEventListener("click", () => { if (pinned && openI === i) closeDay(); else { pinned = true; openDay(i); } });
  });
  if (fine) wrap.addEventListener("mouseleave", () => { if (!pinned) closeDay(); });
  wrap.addEventListener("keydown", e => { if (e.key === "Escape") closeDay(); });
  $("dayNote").innerHTML = C.dayNote;
  $("dayFoot").textContent = C.dayFoot;
  $("intent").textContent = C.intentQuote;
  $("intentSrc").textContent = C.intentSource;
  $("intentParts").innerHTML = C.intentParts.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");

  // ===== AI 활용 =====
  const A = C.ai;
  $("aiHead").textContent = A.headline;
  $("aiLead").innerHTML = A.lead;
  // 배경 도식: 웨이브 목업 전체를 한 번에 맡겼을 때
  const beforeFig = () => {
    const warn = (x, y, label) => `<g><circle cx="${x}" cy="${y}" r="11" class="sf-warn"/><text x="${x}" y="${y + 5}" class="sf-wt">!</text><text x="${x + 18}" y="${y + 5}" class="sf-wl" text-anchor="start">${label}</text></g>`;
    return `<figure class="sf"><svg viewBox="0 0 520 300" role="img" aria-label="웨이브 1 목업에 필요한 기획 전체를 AI에게 한 번에 넘기자 플리퍼 반대 방향, 범퍼 동작 불일치, 다른 팀원 영역 수정이 함께 생긴 구조">
      <rect x="110" y="10" width="300" height="56" rx="10" class="sf-node"/><text x="260" y="33" class="sf-t">웨이브 1 목업 기획 전체</text><text x="260" y="53" class="sf-s">보드, 공, 플리퍼, 범퍼, 콤보</text>
      <path d="M260 66 L260 104" class="sf-line"/>
      <rect x="150" y="104" width="220" height="48" rx="12" class="sf-proj"/><text x="260" y="134" class="sf-t">AI가 한 번에 구현</text>
      <path d="M260 152 L260 190" class="sf-line sf-risk"/>
      <rect x="110" y="190" width="300" height="52" rx="10" class="sf-node"/><text x="260" y="212" class="sf-t">웨이브 목업 빌드</text><text x="260" y="231" class="sf-s">여러 기능이 한꺼번에 바뀜</text>
      ${warn(26, 276, "플리퍼 반대 방향")}${warn(196, 276, "범퍼 동작 불일치")}${warn(366, 276, "팀원 영역 수정")}
    </svg></figure>`;
  };
  // 구현 도식: 객체마다 작업 공간과 확인 기준
  const objectsFig = () => `<figure class="tk"><div class="tk-path"><span class="tk-ic" aria-hidden="true"></span>객체마다 따로 둔 작업 공간</div><div class="tk-grid">${C.objects.map(o => `<div class="tk-f"><div class="tk-h"><b>${o.name}</b><span>worktree</span></div><dl>${o.rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>`).join("")}</div><figcaption>객체는 다른 기능이 없어도 만들고 확인할 수 있게 나눴고, 확인 기준을 통과한 뒤에만 연결했습니다.</figcaption></figure>`;
  // 구현 도식: 시점마다 AI와 담당자가 확인할 일
  const checksFig = () => `<figure class="ck"><div class="ck-h"><span>시점</span><span>AI가 확인</span><span>담당자가 확인</span></div>${C.checks.map(([w, a, h]) => `<div class="ck-r"><b>${w}</b><span>${a}</span><span>${h}</span></div>`).join("")}<figcaption>AI의 완료 보고가 아니라, 다시 실행한 테스트와 직접 조작한 결과로 판단했습니다.</figcaption></figure>`;
  // 구현 도식: 객체 작업 공간 세 곳 → 통합 작업 공간 한 곳 → 웹 빌드
  const mergeFig = () => {
    const lanes = [["공", 18], ["플리퍼", 96], ["범퍼", 174]];
    const boxes = lanes.map(([n, y]) => `<g><rect x="8" y="${y}" width="196" height="58" rx="9" class="rf-box rf-b1"/><text x="24" y="${y + 25}" class="rf-t">${n} worktree</text><text x="24" y="${y + 44}" class="rf-s">브랜치, 대화, 테스트 씬</text></g>`).join("");
    const arrows = lanes.map(([, y]) => `<path d="M204 ${y + 29} C 228 ${y + 29}, 224 127, 248 127" class="rf-arrow" marker-end="url(#mgHead)"/>`).join("");
    return `<figure class="rf"><svg viewBox="0 0 600 250" role="img" aria-label="공, 플리퍼, 범퍼 worktree에서 각각 확인을 마친 객체를 한 담당자가 통합 작업 공간에서 연결하고, 테스트 후 웹 빌드로 내보내는 흐름">
      <defs><marker id="mgHead" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="rf-head"/></marker></defs>
      ${boxes}${arrows}
      <rect x="250" y="88" width="180" height="78" rx="10" class="rf-box rf-b2"/><text x="266" y="116" class="rf-t">통합 작업 공간</text><text x="266" y="136" class="rf-s">한 담당자, 한 브랜치</text><text x="266" y="153" class="rf-s">연결 후 테스트 재실행</text>
      <path d="M430 127 L470 127" class="rf-arrow" marker-end="url(#mgHead)"/>
      <rect x="472" y="98" width="120" height="58" rx="9" class="rf-box"/><text x="488" y="123" class="rf-t">웹 빌드</text><text x="488" y="142" class="rf-s">실제 씬 확인</text>
    </svg><ol class="rf-list"><li><b>공·플리퍼·범퍼</b> 각자의 worktree에서 만들고 확인</li><li><b>통합 작업 공간</b> 한 담당자가 한 브랜치에서 연결</li><li><b>웹 빌드</b> 테스트를 다시 돌리고 실제 씬에서 확인</li></ol><figcaption>객체는 서로 기다리지 않고 동시에 만들고, 연결은 한 곳에서만 합니다.</figcaption></figure>`;
  };
  const evHTML = e => !e ? "" : `<div class="ev">${e.label ? `<p class="ev-l">${e.label}</p>` : ""}`
    + (e.type === "stats" && (e.items || []).length ? `<div class="ev-stats" style="--n:${e.items.length}">${e.items.map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>` : "")
    + (e.type === "checklist" ? `<ul class="ev-check">${e.items.map(x => `<li>${x}</li>`).join("")}</ul>` : "")
    + (e.type === "lists" ? `<div class="ev-lists">${e.cols.map(c => `<div><b>${c.label}</b><ul class="ev-check">${c.items.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>` : "")
    + (e.type === "verdict" ? `<dl class="verdict">${e.rows.map(([k,v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>` : "")
    + (e.note ? `<p class="ev-note">${e.note}</p>` : "")
    + (e.quote ? `<blockquote class="ev-q">${e.quote}<cite>${e.source}</cite></blockquote>` : "")
    + `</div>`;
  // AI 활용 탭: 탭마다 배경, 구현, 결과 순서로 보여 준다.
  const PH = [["bg", "배경"], ["impl", "구현"], ["result", "결과"]];
  const figHTML = f => f === "before" ? beforeFig() : f === "objects" ? objectsFig() : f === "checks" ? checksFig() : f === "merge" ? mergeFig() : "";
  const phHTML = (p, k, name, j) => !p ? "" : `<section class="ph ph-${k}"><h4 class="ph-h"><span class="ph-tag">${name}${String(j + 1).padStart(2, "0")}</span><span>${p.title}</span></h4>`
    + (p.body || "").split("\n\n").filter(Boolean).map(x => `<p>${x}</p>`).join("")
    + [].concat(p.figures || []).map(figHTML).join("")
    + (p.body2 ? `<p>${p.body2}</p>` : "")
    + (p.quote ? `<blockquote>${p.quote.text}<cite>${p.quote.source}</cite></blockquote>` : "")
    + [].concat(p.evidence || []).map(evHTML).join("") + `</section>`;
  const TB = A.tabs;
  $("tablist").innerHTML = TB.map((t, i) => `<button type="button" role="tab" id="tab-${t.id}" aria-controls="tp-${t.id}" aria-selected="false" tabindex="-1" data-i="${i}"><b>${t.label}</b><span class="tq"><i>문제</i>${t.problem}</span><span class="tq"><i>해결</i>${t.fix}</span><span class="row">${t.tags.map(x => `<em>${x}</em>`).join("")}</span><span class="tbar"></span></button>`).join("");
  $("tview").innerHTML = TB.map((t, i) => `<div class="tp" role="tabpanel" id="tp-${t.id}" aria-labelledby="tab-${t.id}" data-i="${i}"><div class="tp-in st"><p class="tp-k"><b>${t.label}</b>${t.tags.map(x => `<span class="comp">${x}</span>`).join("")}</p>${PH.map(([k, n]) => [].concat(t[k] || []).map((p, j) => phHTML(p, k, n, j)).join("")).join("")}</div></div>`).join("");

  // 스크롤하면 현재 탭의 내용이 끝까지 올라간 뒤 다음 탭으로 바뀌고, 탭을 누르면 그 탭으로 바로 바뀐다.
  const scrollTabs = (rootEl, list, view, opts) => {
    const stageEl = rootEl.firstElementChild, btns = [...list.children], tps = [...view.children], tins = tps.map(p => p.firstElementChild);
    let extras = [], starts = [], dwell = 0, act = -1, tick = false;
    function setTab(i){
      if (i === act) return; act = i;
      btns.forEach((b, j) => { const on = j === i; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; b.classList.toggle("on", on); });
      tps.forEach((p, j) => { const on = j === i; p.classList.toggle("on", on); p.classList.toggle("up", j < i); p.inert = !on; });
      const b = btns[i]; if (list.scrollWidth > list.clientWidth) list.scrollTo({ left: b.offsetLeft - 16, behavior: "smooth" });
      if (opts.onTab) opts.onTab(i);
    }
    function update(){
      tick = false;
      if (!starts.length) return;
      const y = (parseFloat(getComputedStyle(stageEl).top) || 0) - rootEl.getBoundingClientRect().top;
      let i = 0; starts.forEach((s, j) => { if (y >= s) i = j; });
      tins.forEach((n, j) => {
        const off = j < i ? extras[j] : j > i ? 0 : Math.min(extras[j], Math.max(0, y - starts[j] - dwell * .2));
        n.style.transform = `translateY(${-off}px)`;
        btns[j].style.setProperty("--p", j < i ? 1 : j > i ? 0 : extras[j] ? off / extras[j] : 1);
      });
      setTab(i);
    }
    function measure(){
      if (paged()) return;
      if (opts.pad) opts.pad(tins);
      const avail = view.clientHeight;

    </figure>`;
  const comboTable = () => `<figure class="df dpf df-otab"><table class="otab"><thead><tr><th>대상</th><th>콤보 수</th><th>3초 갱신</th><th>규칙</th></tr></thead><tbody>
      ${[["범퍼", "+1", "O", "새 유효 타격만. 붙어 있는 동안은 한 번"], ["활성 플리퍼", "–", "권한 1회", "직전 유효 타격이 준 권한을 한 번 소비"], ["벽", "–", "–", "반사만"], ["코인", "–", "–", "통과하며 한 번 수집"], ["파괴된 범퍼", "–", "–", "공이 그대로 통과"]].map(([a, b, c, d]) => `<tr><td><b>${a}</b></td><td class="${b === "+1" ? "y" : "n"}">${b}</td><td class="${c === "O" ? "y" : c === "–" ? "n" : "c"}">${c}</td><td>${d}</td></tr>`).join("")}
    </tbody></table><p class="df-note">콤보가 끝나면 한 번만 점수로 정산합니다. 정산 점수는 스테이지 기본 점수 × 유효 타격 × 단계 배율입니다(11콤보부터 ×5, 21콤보부터 ×10, 36콤보부터 ×20).</p></figure>`;
  const designFig = k => k === "states" ? statesFig() : k === "respawnSim" ? respawnSim() : k === "comboSim" ? comboSim() : k === "comboTable" ? comboTable() : "";
  const statHTML = s => `<div class="bs-i${s.pending ? " pend" : ""}"><span class="bs-l">${s.label}</span><span class="bs-v"><s>${s.before}</s><i aria-hidden="true">→</i><b>${s.after}</b></span></div>`;
  $("cview").innerHTML = C.cases.map(k => {
    const v = C.values.items[k.principle];
    return `<div class="tp cp" role="tabpanel" id="case-${k.id}" aria-labelledby="ctab-${k.id}"><div class="tp-in cp-in">
      <p class="case-k"><span class="pn">${caseNo(k.id)} ${(K.loop.find(l => l.hook && l.hook.case === k.id) || {}).key || ""}</span>${v.name}</p>
      <h3 class="case-t">${k.headline}</h3>
      <div class="ba" role="button" tabindex="0" aria-label="${k.name} After 영상 재생" aria-pressed="false" aria-describedby="compare-hint-${k.id}">
        ${comparisonSide(k, "before")}${comparisonSide(k, "after")}
      </div>
      <div class="compare-tools"><p class="compare-hint" id="compare-hint-${k.id}" aria-live="polite"></p></div>
      ${k.comparisonNote ? `<p class="comparison-note">${k.comparisonNote}</p>` : ""}
      <div class="cf">
        <div class="cf-s cf-emo"><span class="cf-tag">기대 감정</span><p class="emo">“${k.emotion}”</p></div>
        <div class="cf-s"><span class="cf-tag">문제</span>${k.problem.split("\n\n").map(x => `<p>${x}</p>`).join("")}</div>
        <div class="cf-s cf-design"><span class="cf-tag">설계</span>${k.design.split("\n\n").map((x, i) => `<p>${x}</p>${k.designFigs && k.designFigs[i] ? designFig(k.designFigs[i]) : ""}`).join("")}</div>
        <div class="cf-s"><span class="cf-tag">결과</span>${k.result.split("\n\n").map(x => `<p>${x}</p>`).join("")}${k.stats.length ? `<div class="bs in">${k.stats.map(statHTML).join("")}</div>` : ""}</div>
        ${k.next ? `<div class="cf-s"><span class="cf-tag">다음 판단</span><p>${k.next}</p></div>` : ""}
      </div>
    </div></div>`;
  }).join("");

  // 범퍼 복구 시뮬레이션: 장면을 고르고 재생하면 실제 판정 규칙대로 상태가 바뀐다.
  document.querySelectorAll("[data-rsim]").forEach(sim => {
    const tabs = [...sim.querySelectorAll(".sim-tab")], stage = sim.querySelector("[data-stage]"), logEl = sim.querySelector("[data-log]"), noteEl = sim.querySelector("[data-note]");
    const play = sim.querySelector('[data-act="play"]'), naiveEl = sim.querySelector("[data-naive]");
    const reduce = matchMedia("(prefers-reduced-motion: reduce)"), SLOW = 0.33;
    let cur = 1, raf = 0, t0 = 0;
    const paint = t => {
      const sc = rsScenes[cur], naive = naiveEl.checked, r = rsRun(sc, t, naive);
      stage.innerHTML = rsSVG(sc, t, naive);
      logEl.innerHTML = r.log.map(l => `<li class="${l.kind || ""}"><time>${l.t.toFixed(2)}초</time><span>${l.text}</span></li>`).join("");
      return r;
    };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; play.textContent = "복구 시간 종료부터 재생"; };
    const run = () => {
      stop(); const sc = rsScenes[cur];
      if (reduce.matches || paged()) { paint(sc.end); return; }
      play.textContent = "재생 중…"; t0 = performance.now();
      const step = now => {
        const t = Math.min(sc.end, (now - t0) / 1000 * SLOW), r = paint(t);
        if (t >= sc.end || r.hit) { stop(); return; }
        raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };
    const select = i => { cur = i; tabs.forEach((b, k) => b.setAttribute("aria-selected", String(k === i))); noteEl.textContent = rsScenes[i].note; stop(); paint(0); };
    tabs.forEach((b, i) => b.addEventListener("click", () => { select(i); run(); }));
    play.addEventListener("click", run);
    naiveEl.addEventListener("change", () => { stop(); paint(0); run(); });
    new IntersectionObserver(es => { if (!es[0].isIntersecting) stop(); }, { threshold: 0 }).observe(sim);
    select(1);
  });
  // 콤보 시뮬레이션
  document.querySelectorAll("[data-csim]").forEach(sim => {
    const el = k => sim.querySelector(`[data-${k}]`), SLOW = 0.5, HOLD = 3;
    const stages = [[36, "Ultra ×20", 20], [21, "Hyper ×10", 10], [11, "Super ×5", 5], [1, "Normal ×1", 1]];
    const stageOf = n => stages.find(s => n >= s[0]) || [0, "콤보 없음", 0];
    let n = 0, left = 0, tok = false, stuck = "", raf = 0, last = 0, log = [];
    const say = (text, kind) => { const p = el("last"); p.textContent = text; p.className = "cs-last " + (kind || ""); log.unshift(text); log = log.slice(0, 4); el("log").innerHTML = log.slice(1).map(x => `<li>${x}</li>`).join(""); };
    const paint = () => {
      el("n").textContent = n ? "x" + n : "0"; el("stage").textContent = stageOf(n)[1];
      el("fill").style.width = (n ? left / HOLD * 100 : 0) + "%"; el("bar").classList.toggle("low", n && left / HOLD <= .3);
      el("left").textContent = n ? `남은 시간 ${left.toFixed(1)}초` : "남은 시간 -";
      const t = el("tok"); t.classList.toggle("on", tok); t.textContent = tok ? "플리퍼 갱신 권한 있음" : "플리퍼 갱신 권한 없음";
      sim.querySelector('[data-act="stay"]').disabled = !stuck;
    };
    const tick = now => {
      const dt = Math.min(.1, (now - last) / 1000) * SLOW; last = now;
      if (n) { left = Math.max(0, left - dt); if (left <= 0) { const m = stageOf(n)[2]; say(`시간 초과로 콤보 종료 · 정산 100 × ${n} × ${m} = ${(100 * n * m).toLocaleString()}점`, "end"); n = 0; tok = false; stuck = ""; } }
      paint(); raf = n ? requestAnimationFrame(tick) : 0;
    };
    const runTimer = () => { if (!raf && n) { last = performance.now(); raf = requestAnimationFrame(tick); } };
    const hit = id => { n++; left = HOLD; tok = true; stuck = id; say(`범퍼 ${id} 새 유효 타격 · ${n}콤보, 3초로 갱신, 갱신 권한 생김`, "up"); runTimer(); };
    const act = {
      a: () => stuck === "A" ? say("이미 A에 붙어 있어 같은 접촉입니다 · 변화 없음", "no") : hit("A"),
      stay: () => say(`범퍼 ${stuck}에 붙은 채 접촉 · 반사만 하고 점수·콤보·내구도는 그대로`, "no"),
      again: () => { stuck = ""; hit("A"); },
      b: () => stuck === "B" ? say("이미 B에 붙어 있어 같은 접촉입니다 · 변화 없음", "no") : hit("B"),
      wall: () => { stuck = ""; say(n ? "벽에 튕김 · 벽은 콤보와 시간을 바꾸지 않음" : "벽에 튕김 · 콤보 없음", "no"); },
      flip: () => { stuck = ""; if (!n) say("플리퍼로 침 · 진행 중인 콤보 없음", "no"); else if (tok) { tok = false; left = HOLD; say("플리퍼로 살림 · 권한을 써서 3초를 다시 채움(콤보 수는 그대로)", "up"); } else say("플리퍼로 침 · 권한이 없어 시간은 그대로, 새 범퍼를 맞혀야 생김", "no"); },
      reset: () => { cancelAnimationFrame(raf); raf = 0; n = 0; left = 0; tok = false; stuck = ""; log = []; el("log").innerHTML = ""; say("범퍼를 맞혀 콤보를 시작해 보세요."); }
    };
    sim.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => { act[b.dataset.act](); paint(); }));
    document.addEventListener("visibilitychange", () => { if (document.hidden) act.reset(); });
    paint();
  });

  // Before/After: After 영상을 재생하고 Before 도식은 그대로 둔다. 짧은 영상은 마지막 장면에서 기다린다.
  const comparisons = [...document.querySelectorAll("#cview .cp")].map((panel, index) => {
    const box = panel.querySelector(".ba"), hint = panel.querySelector(".compare-hint"), k = C.cases[index];
    const sides = [...box.querySelectorAll(".ba-p")].map((p, i) => ({ v: p.querySelector("video"), cue: p.querySelector(".ba-cue"), info: [k.before.media, k.after.media][i] }));
    const vids = sides.filter(s => s.v), videos = vids.map(s => s.v);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)");
    let active = false, epoch = 0, aborter = null, frame = 0, mode = "";
    const idleText = () => "호버하거나 탭하면 After 영상을 재생합니다.";
    const available = () => panel.classList.contains("on") && !document.hidden && !paged();
    function stop(message) {
      active = false; epoch++; mode = "";
      if (aborter) aborter.abort();
      cancelAnimationFrame(frame);
      videos.forEach(v => { v.pause(); if (v.readyState) v.currentTime = 0; });
      box.classList.remove("playing"); box.setAttribute("aria-pressed", "false"); box.removeAttribute("aria-busy");
      hint.textContent = message || idleText();
      sides.forEach(s => s.cue.textContent = s.info.focus);
    }
    function ready(v, signal) {
      return new Promise((resolve, reject) => {
        let timer;
        const clean = () => { clearTimeout(timer); v.removeEventListener("canplay", done); v.removeEventListener("error", fail); signal.removeEventListener("abort", fail); };
        const done = () => { clean(); resolve(); };
        const fail = () => { clean(); reject(new Error("영상 준비 실패")); };
        if (signal.aborted) { fail(); return; }
        if (v.readyState >= 3) { done(); return; }
        v.addEventListener("canplay", done); v.addEventListener("error", fail); signal.addEventListener("abort", fail);
        timer = setTimeout(fail, 20000);
        v.preload = "auto"; v.load();
      });
    }
    async function start(origin) {
      if (active || !available() || !videos.length) return;
      active = true; mode = origin; const token = ++epoch;
      aborter = new AbortController();
      box.setAttribute("aria-pressed", "true"); box.setAttribute("aria-busy", "true");
      hint.textContent = "영상을 준비하고 있습니다…";
      try {
        await Promise.all(videos.map(v => ready(v, aborter.signal)));
        if (token !== epoch || !available()) return;
        videos.forEach(v => { v.currentTime = 0; v.muted = true; });
        await Promise.all(videos.map(v => v.play()));
        if (token !== epoch) return;
        box.classList.add("playing"); box.removeAttribute("aria-busy");
        hint.textContent = "재생 중 · 다시 탭하거나 Enter를 누르면 썸네일로 돌아갑니다.";
        function track() {
          if (!active || token !== epoch) return;
          if (!available()) { stop(); return; }
          if (videos.every(v => v.ended)) { stop("재생이 끝났습니다. 다시 탭하면 처음부터 재생합니다."); return; }
          vids.forEach(s => {
            const chapter = (s.info.chapters || []).filter(c => c[0] <= s.v.currentTime).pop();
            s.cue.textContent = (chapter ? chapter[1] : s.info.focus) + (s.v.ended ? " · 재생 완료" : "");
          });
          frame = requestAnimationFrame(track);
        }
        track();
      } catch (e) {
        if (token === epoch) stop("영상을 불러오지 못했습니다. 탭해서 다시 시도해 주세요.");
      }
    }
    const flip = () => active ? stop() : start("manual");
    box.addEventListener("pointerenter", e => { if (e.pointerType === "mouse" && !reduce.matches) start("hover"); });
    box.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && mode === "hover") stop(); });
    box.addEventListener("click", flip);
    box.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
    new IntersectionObserver(es => { if (!es[0].isIntersecting) stop(); }, { threshold: 0 }).observe(box);
    document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });
    reduce.addEventListener("change", () => stop());
    stop();
    return { stop };
  });
  // 대표 시스템 탭: 스크롤하면 01 → 02로 넘어가고, 탭이나 루프의 끊긴 곳을 누르면 그 사례로 바로 간다.
  $("ctablist").innerHTML = C.cases.map(k => {
    const l = K.loop.find(x => x.hook && x.hook.case === k.id) || {};
    return `<button type="button" role="tab" id="ctab-${k.id}" aria-controls="case-${k.id}" aria-selected="false" tabindex="-1"><span class="ct-n">${caseNo(k.id)}</span><span class="ct-k">${l.key || ""}</span><b class="ct-t">${k.name}</b><span class="ct-h">${l.hook ? l.hook.text : ""}</span><span class="tbar"></span></button>`;
  }).join("");
  const caseTabs = scrollTabs($("ctabs"), $("ctablist"), $("cview"), { lastFlush: true, onTab: () => comparisons.forEach(c => c.stop()) });
  // 탭 목록은 평소에 숨겨 두고, 스크롤하면 핵심 플레이 루프의 끊긴 곳 카드가 위로 모이며 탭으로 바뀌는 것처럼 보이게 한다.
  (() => {
    const list = $("ctablist"), rootEl = $("ctabs"), stage = rootEl.firstElementChild, btns = [...list.children];
    const lis = [...document.querySelectorAll(".core-loop > li")];
    const pairs = btns.map((b, i) => ({ b, li: lis[K.loop.findIndex(l => l.hook && l.hook.case === C.cases[i].id)] })).filter(p => p.li);
    const rest = lis.filter(li => !pairs.some(p => p.li === li));
    const reduce = matchMedia("(prefers-reduced-motion: reduce)"), wide = matchMedia("(min-width: 761px)");
    const layer = document.createElement("div"); layer.className = "morph"; layer.setAttribute("aria-hidden", "true"); layer.style.display = "none";
    const ghosts = pairs.map((p, i) => {
      const g = document.createElement("div"); g.className = "mg";
      const a = p.li.querySelector(".cl-c").cloneNode(true); a.classList.add("mg-a");
      const b = document.createElement("div"); b.className = "ctablist shown mg-b"; const bt = p.b.cloneNode(true); bt.removeAttribute("id"); bt.tabIndex = -1; bt.classList.toggle("on", i === 0); b.append(bt);
      g.append(a, b); layer.append(g); return g;
    });
    document.body.append(layer);
    const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    let tick = false;
    function frame(){
      tick = false;
      if (paged()) { layer.remove(); return; }
      const stickyTop = parseFloat(getComputedStyle(stage).top) || 0;
      const y0 = scrollY + lis[0].getBoundingClientRect().top - innerHeight * .6, y1 = scrollY + rootEl.getBoundingClientRect().top - stickyTop;
      const t = Math.max(0, Math.min(1, (scrollY - y0) / Math.max(1, y1 - y0)));
      list.classList.toggle("shown", t >= 1);
      const morph = wide.matches && !reduce.matches && t > 0 && t < 1;
      layer.style.display = morph ? "" : "none";
      if (!morph) {
        const completed = wide.matches && !reduce.matches && t >= 1;
        lis.forEach(li => {
          li.style.opacity = completed ? "0" : "";
          li.inert = completed;
          li.querySelectorAll(".cl-c,.hook").forEach(x => { x.style.visibility = ""; x.style.opacity = ""; });
        });
        return;
      }
      lis.forEach(li => { li.style.opacity = ""; li.inert = false; });
      const e = ease(t), sr = stage.getBoundingClientRect();
      pairs.forEach((p, i) => {
        const card = p.li.querySelector(".cl-c"), hook = p.li.querySelector(".hook"), a = card.getBoundingClientRect(), br = p.b.getBoundingClientRect(), bt = stickyTop + (br.top - sr.top);
        const L = a.left + (br.left - a.left) * e, T = a.top + (bt - a.top) * e, W = a.width + (br.width - a.width) * e, H = a.height + (br.height - a.height) * e;
        const g = ghosts[i];
        g.style.cssText = `left:${L}px;top:${T}px;width:${W}px;height:${H}px;--a:${Math.max(0, 1 - e * 1.7)};--b:${Math.max(0, (e - .5) / .5)};--f:${Math.min(1, e * 2.5)}`;
        g.firstElementChild.style.width = a.width + "px"; g.firstElementChild.style.height = a.height + "px";
        card.style.visibility = "hidden"; if (hook) hook.style.opacity = String(Math.max(0, 1 - e * 2.2));
      });
      rest.forEach(li => li.style.opacity = String(Math.max(0, 1 - e * 1.6)));
    }
    const req = () => { if (!tick) { tick = true; requestAnimationFrame(frame); } };
    addEventListener("scroll", req, { passive: true });
    addEventListener("resize", req);
    frame();
  })();
  document.querySelectorAll(".hook").forEach(a => a.addEventListener("click", e => {
    const i = C.cases.findIndex(k => "#case-" + k.id === a.getAttribute("href"));
    if (i < 0 || paged()) return;
    e.preventDefault(); caseTabs.go(i);
  }));

  $("oth").innerHTML = C.otherSystems.map(o => `<article><header class="oth-head"><b>${o.name}</b><span class="tg">${o.tag}</span></header>${o.image ? `<figure class="oth-v"><img class="oth-img" src="${o.image.src}" alt="${o.image.cap}" loading="lazy"><figcaption>${o.image.cap}</figcaption></figure>` : ""}<p>${o.problem}</p><p class="res">${o.result}</p></article>`).join("");

  // 검증: 자동 검사 결과와 직접 플레이로 확인한 것, 판단 기준을 나란히 둔다.
  const T = C.tests;
  $("testHead").textContent = T.title;
  $("fb").innerHTML = `<div class="fb-c"><p class="small">자동 검사</p><dl>${T.auto.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl><p class="small" style="margin:12px 0 0">${T.autoNote}</p></div>
    <div class="fb-c"><p class="small">직접 플레이로 확인한 것</p><ul class="chips" style="margin:0">${li(T.played)}</ul></div>
    <div class="fb-c fb-d"><p class="serif">${T.decide}</p><p style="margin:0;font-size:15px">${T.decideBody}</p></div>`;
  $("testEvidence").innerHTML = T.evidence.map(e => `<figure class="test-shot"><button type="button" aria-label="${esc(e.title)} 화면 확대"><img src="${esc(e.src)}" alt="${esc(e.caption)}" loading="lazy"></button><figcaption><b>${esc(e.title)}</b>${esc(e.caption)}</figcaption></figure>`).join("");
  // 장면 확대 보기
  (() => {
    const dlg = document.createElement("dialog");
    dlg.className = "pf-zoom";
    dlg.innerHTML = '<img alt=""><p></p><button type="button" aria-label="닫기">×</button>';
    document.body.appendChild(dlg);
    const im = dlg.querySelector("img"), cap = dlg.querySelector("p");
    document.addEventListener("click", e => {
      const t = e.target.closest(".oth-img, .test-shot img") || e.target.closest(".test-shot button")?.querySelector("img");
      if (!t || paged() || !dlg.showModal) return;
      im.src = t.dataset.zoomSrc || t.src; im.alt = t.alt; cap.textContent = t.alt; dlg.showModal();
    });
    dlg.addEventListener("click", () => dlg.close());
  })();

  $("mine").innerHTML = li(C.scope.mine);
  $("others").innerHTML = li(C.scope.others);
  $("scopeNote").textContent = C.scope.notes;
  $("links").innerHTML = C.links.map(l => `<a href="${l.href}"${l.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}>${l.label}</a>`).join(" &nbsp; ");
})();
</script>
<script src="paged.js"></script>
</body>
</html>
